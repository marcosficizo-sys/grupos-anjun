<style>
:root{
 --bg:#eef2ef;--surface:#ffffff;--ink:#17211b;--muted:#5a6a60;--line:#d3ddd6;--soft:#f5f8f6;
 --green:#009845;--green-ink:#007a37;--on-green:#ffffff;--warn:#a85b00;--red:#c4271b;--focus:#0a7cff;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#101613;--surface:#18201b;--ink:#e6efe9;--muted:#9bb0a3;--line:#2c3a31;--soft:#1e2822;
 --green:#22b45f;--green-ink:#5fd38f;--on-green:#06120a;--warn:#f0a649;--red:#ff7a6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101613;--surface:#18201b;--ink:#e6efe9;--muted:#9bb0a3;--line:#2c3a31;--soft:#1e2822;
 --green:#22b45f;--green-ink:#5fd38f;--on-green:#06120a;--warn:#f0a649;--red:#ff7a6e;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,"Segoe UI",Roboto,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-right:auto}
.brand img{height:26px;background:#fff;border-radius:4px;padding:2px 4px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{font:inherit;font-weight:600;border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--green);color:var(--on-green)}
body.out nav{display:none}
.login{max-width:380px;margin:40px auto}
.linkbtn{font:inherit;border:0;background:none;color:var(--green-ink);cursor:pointer;text-decoration:underline;padding:0 0 0 8px}
.st{font-size:13px;color:var(--muted);width:100%;text-align:right;margin-top:-6px}
main{max-width:1240px;margin:0 auto;padding:18px 16px 40px}
.grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{font-size:17px;margin:0 0 12px}
fieldset{border:0;padding:0;margin:0 0 16px}
legend{font-weight:700;font-size:14px;color:var(--green-ink);padding:0;margin-bottom:6px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:8px 0 3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--muted);margin-top:3px}
.hint.warn{color:var(--warn)}
.addr{font-size:13px;margin-top:4px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:700;width:40px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.stop{border-left:3px solid var(--green);padding-left:10px;margin-top:10px}
.stop h3{font-size:14px;margin:0}
.btn{font:inherit;font-weight:600;border:1px solid var(--green);background:var(--green);color:var(--on-green);padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.sec{background:transparent;color:var(--green-ink)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.del{background:transparent;border-color:var(--line);color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.msg{min-height:1.2em;font-size:13.5px;color:var(--green-ink);margin:0 0 8px}
/* folha */
.paperwrap{overflow-x:auto;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:18px}
.paper{background:#fff;color:#000;width:max-content;padding:22px 26px 18px;font-family:Aptos,Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:14.5px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sheet{border-collapse:collapse;table-layout:fixed}
.sheet td{padding:1px 6px;height:20px;vertical-align:middle;overflow:hidden}
.sheet td.l{width:162px;background:#C1F0C8;font-weight:700;text-align:right;border:2px solid #000;white-space:nowrap}
.sheet td.v{width:372px;text-align:center;border:2px solid #000;background:#fff}
.sheet td.b{font-weight:700}
.sheet tr.gap td{border:0;height:20px;background:transparent}
.sheet td.t{border:2px solid #000;background:#C1F0C8;font-weight:700;font-size:21px;text-align:center;height:61px;position:relative}
.sheet td.t img{position:absolute;left:10px;top:50%;transform:translateY(-50%);height:38px}
.sheet td.mdfe{font-family:Arial,sans-serif;font-size:13.5px;color:#71717A;word-break:break-all}
.sheet tr.tall td{height:54px}
.sheet .empty{color:#b0b0b0;font-weight:400}
.send{margin-top:26px;font-family:"Aptos Narrow",Calibri,Arial,sans-serif;font-size:14.5px;padding-left:2px}
@media print{
 header,.noprint,.grid>.panel{display:none!important}
 body,main,.paperwrap{background:#fff;padding:0;margin:0;border:0}
 .grid{display:block}.paper{box-shadow:none;padding:0}
 :root{padding:0}
}
/* cadastros */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.tools .grow{flex:1 1 220px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.list{border-collapse:collapse;width:100%;font-size:14px}
table.list th{text-align:left;font-size:12.5px;color:var(--muted);background:var(--soft);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr:last-child td{border-bottom:0}
table.list td.act{white-space:nowrap;text-align:right}
table.list input{padding:5px 7px}
.count{font-size:13px;color:var(--muted);margin:8px 2px 0}
.addform{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;margin:4px 0 14px;padding:12px;background:var(--soft);border-radius:10px}
.addform label{margin-top:0}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

 </fieldset>
 <button type="button" class="btn sec" id="limpar">Nova solicitação</button>

function linhas(){ // modelo da aba "Mod 1"
 const o=base(ORIGEM),R=[];
 R.push({t:1});
 R.push({l:'DATA SAÍDA:',v:dataBR(f.data)});
 R.push({l:'HORÁRIO PROGRAMADO:',v:f.hora,tall:1});
 R.push({gap:1});
 R.push({l:'MOTORISTA:',v:up(f.mot),b:1});
 R.push({l:'PLACA:',v:normPlaca(f.placa),b:1});
 R.push({gap:1});
 R.push({l:'SAIDA DE:',v:o?cidadeUF(o):'CONTAGEM MG'});
 R.push({l:'ENDEREÇO:',v:o?o.e:''});
 R.push({gap:1},{gap:1},{gap:1});
 for(let i=0;i<f.n;i++){const c=nc(f.dest[i]);R.push({l:'DESTINO:',v:c?comAntigo(c):''});R.push({l:'ENDEREÇO:',v:endDe(i)});R.push({gap:1})}
 R.push({l:'VALOR DO VEÍCULO: R$',v:moeda(f.valor)});
 R.push({l:'CHAVE MDFe:',v:f.mdfe.replace(/\D/g,''),mdfe:1});
 return R;
}
function folha(){
 return `<table class="sheet">${linhas().map(r=>r.t?`<tr><td class="t" colspan="2"><img alt="" src="data:image/png;base64,${LOGO}">SOLICITAÇÃO DE MONITORAMENTO</td></tr>`
  :r.gap?`<tr class="gap"><td></td><td></td></tr>`
  :`<tr${r.tall?' class="tall"':''}><td class="l">${esc(r.l)}</td><td class="v${r.b?' b':''}${r.mdfe?' mdfe':''}">${r.v?esc(r.v):'<span class="empty">—</span>'}</td></tr>`).join('')}</table>
  <div class="send">Enviar para:&nbsp;&nbsp;${esc(f.fone)}</div>`;
}
const dataBR=iso=>iso?iso.split('-').reverse().join('/'):'';
function num(v){if(v==null||v==='')return null;if(typeof v==='number')return v;let s=String(v).replace(/[^\d,.\-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?null:n}
function moeda(v){const n=num(v);return n==null?'':n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}

function ligarForm(){
 const v=document.getElementById('view');
 const on=(id,ev,fn)=>{const e=document.getElementById(id);if(e)e.addEventListener(ev,fn)};
 on('fdata','change',e=>{f.data=e.target.value;upd()});
 on('fhora','change',e=>{f.hora=e.target.value;upd()});
 on('fmot','change',e=>{f.mot=up(e.target.value);const m=st.mot.find(x=>x.n===f.mot);
  if(m&&m.p){f.placa=m.p;autoValor()} if(m)f.fone=m.tel||''; upd(true)});
 on('fpla','change',e=>{f.placa=normPlaca(e.target.value);autoValor();upd(true)});
 on('fval','input',e=>{f.valor=e.target.value;upd()});
 on('fmdfe','input',e=>{f.mdfe=e.target.value.replace(/\D/g,'');upd()});
 on('fmdfe','change',()=>render());
 on('ffone','input',e=>{f.fone=e.target.value.replace(/\D/g,'');upd()});
 v.querySelectorAll('[data-n]').forEach(b=>b.addEventListener('click',()=>{f.n=+b.dataset.n;upd(true)}));
 v.querySelectorAll('[data-dest]').forEach(i=>i.addEventListener('change',e=>{f.dest[+i.dataset.dest]=nc(e.target.value);upd(true)}));
 v.querySelectorAll('[data-end]').forEach(t=>t.addEventListener('input',e=>{const i=+t.dataset.end;f.end[i+'|'+nc(f.dest[i])]=e.target.value;upd()}));
 on('addmot','click',()=>{const m=st.mot.find(x=>x.n===up(f.mot));if(!m){const p=st.pla.find(x=>x.p===normPlaca(f.placa));st.mot.push({n:up(f.mot),t:p?p.t:'',p:normPlaca(f.placa),tel:f.fone});ordenar();salvar('mot');msg='Motorista adicionado ao cadastro.'}render()});
 on('addpla','click',()=>{const p=normPlaca(f.placa);if(!st.pla.some(x=>x.p===p)){const m=st.mot.find(x=>x.n===up(f.mot));st.pla.push({p,tipo:'',t:m?m.t:'',v:num(f.valor)});ordenar();salvar('pla');msg='Placa adicionada. Complete o tipo em Atualizar placas.'}render()});
 on('limpar','click',()=>{novaSolic();msg='';upd(true)});
 on('bxls','click',()=>gerar('excel'));on('bimg','click',()=>gerar('imagem'));on('bprint','click',()=>gerar('pdf'));
}
function autoValor(){const p=st.pla.find(x=>x.p===normPlaca(f.placa));if(p&&p.v!=null)f.valor=moeda(p.v)}
function upd(full){gravarLocal();if(full){const a=document.activeElement&&document.activeElement.id;if(emRender){agendado=true;return}render();if(a){const e=document.getElementById(a);if(e&&e.tagName!=='BUTTON'&&e.tagName!=='TEXTAREA'&&e.type!=='date'&&e.type!=='time')e.focus()}}else{document.getElementById('paper').innerHTML=folha()}}

function nomeArquivo(){
 const cid=[];for(let i=f.n-1;i>=0;i--){const b=base(f.dest[i]);const n=b?b.ci:f.dest[i];if(n&&!cid.includes(n))cid.push(n)}
 const d=f.data?f.data.slice(8,10)+'_'+f.data.slice(5,7):'';
 return (semAcento(cid.join(' X ')).toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'')||'MONITORAMENTO')+(d?'_'+d:'');
}
function entregar(blob,nome){
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();
}
let gerando=false;
async function gerar(tipo){
 if(gerando)return;
 const falta=[];if(!f.mot)falta.push('motorista');if(!f.placa)falta.push('placa');if(!nc(f.dest[0]))falta.push('destino da parada 1');
 if(falta.length){msg='Preencha antes de gerar: '+falta.join(', ')+'.';render();return}
 const md=f.mdfe.replace(/\D/g,'');
 if(md.length!==44&&!confirm(md?'A chave MDF-e tem '+md.length+' dígitos (o certo são 44). Gerar assim mesmo?':'A chave MDF-e está vazia. Gerar assim mesmo?'))return;
 gerando=true;
 try{
  let blob=null;const nome=nomeArquivo();
  if(tipo==='excel'){blob=await montarExcel();if(!blob)return}
  if(tipo==='imagem'){blob=await montarImagem();if(!blob)return}
  const reg=await registrar(tipo);
  if(!reg.ok&&!confirm('Não consegui salvar no histórico ('+reg.erro+'). Gerar mesmo assim, sem registrar?'))return;
  if(tipo==='excel')entregar(blob,nome+'.xlsx');
  else if(tipo==='imagem')entregar(blob,nome+'.png');
  else window.print();
  if(reg.ok){novaSolic();gravarLocal();msg='Solicitação salva no histórico e formulário zerado. Para baixar de novo, use Reabrir no Histórico.'}
  else msg='Arquivo gerado sem registro no histórico.';
  render();
 }finally{gerando=false}
}
function registro(){
 const pl=st.pla.find(x=>x.p===normPlaca(f.placa))||{},mo=st.mot.find(x=>x.n===up(f.mot))||{};
 const paradas=[];for(let i=0;i<f.n;i++){const c=nc(f.dest[i]);if(!c)continue;const b=base(c);paradas.push({c,cidade:b?b.ci:'',uf:b?b.uf:'',endereco:endDe(i)})}
 return {tipo:'hist',mes:(f.data||hojeISO()).slice(0,7),dataSaida:f.data,horaSaida:f.hora,motorista:up(f.mot),celular:f.fone,placa:normPlaca(f.placa),
  tipoVeiculo:pl.tipo||'',transportadora:pl.t||mo.t||'',origem:ORIGEM,paradas,qtdParadas:paradas.length,
  destinos:paradas.map(p=>p.c).join(' > '),valorVeiculo:num(f.valor),mdfe:f.mdfe.replace(/\D/g,'')};
}
async function registrar(acao){
 if(!db||!eu)return {ok:false,erro:'sem login'};
 const r=registro(),ag=new Date().toISOString(),por=eu.nome||eu.usuario||'';
 const ac={acao,por,em:ag};
 try{
  const col=db.collection('monitoramento_hist');
  const ref=r.mdfe.length===44?col.doc(r.mdfe):col.doc();
  await db.runTransaction(async tx=>{const s=await tx.get(ref);
   if(s.exists){const d=s.data();tx.update(ref,{...r,acoes:[...(d.acoes||[]),ac].slice(-30),atualizadoEm:firebase.firestore.FieldValue.serverTimestamp(),atualizadoPor:por})}
   else tx.set(ref,{...r,acoes:[ac],geradoPor:por,geradoPorUid:eu.uid,criadoEm:firebase.firestore.FieldValue.serverTimestamp(),geradoEmTxt:ag})});
  return {ok:true};
 }catch(e){return {ok:false,erro:erroFb(e)}}
}
async function montarExcel(){
 if(!window.ExcelJS){msg='Não consegui carregar o gerador de Excel. Recarregue a página.';render();return null}
 const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet('Mod 1',{views:[{showGridLines:true}]});
 ws.getColumn(1).width=8.43;ws.getColumn(2).width=11.875;ws.getColumn(3).width=20.75;ws.getColumn(4).width=15.375;[5,6,7,8].forEach(c=>ws.getColumn(c).width=8.43);
 const fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFC1F0C8'}};const med={style:'medium',color:{argb:'FF000000'}};
 const box=r=>{for(let c=3;c<=8;c++){const cell=ws.getCell(r,c);cell.border={top:med,bottom:med,left:(c===3||c===4)?med:undefined,right:(c===3||c===8)?med:undefined}}};
 let r=4;
 ws.mergeCells(4,3,4,8);const t=ws.getCell(4,3);t.value='SOLICITAÇÃO DE MONITORAMENTO';t.font={name:'Aptos',size:16,bold:true};t.alignment={horizontal:'center',vertical:'middle'};t.fill=fill;
 ws.getRow(4).height=46.15;for(let c=3;c<=8;c++)ws.getCell(4,c).border={top:med,bottom:med,left:c===3?med:undefined,right:c===8?med:undefined};
 const img=wb.addImage({base64:LOGO,extension:'png'});ws.addImage(img,{tl:{col:2.07,row:3.2},ext:{width:131,height:38}});
 r=5;
 for(const L of linhas().slice(1)){
  if(L.gap){ws.getRow(r).height=15;r++;continue}
  const l=ws.getCell(r,3);l.value=L.l;l.font={name:'Aptos',size:11,bold:true};l.alignment={horizontal:'right',vertical:'middle'};l.fill=fill;
  ws.mergeCells(r,4,r,8);const v=ws.getCell(r,4);
  if(L.l==='DATA SAÍDA:'&&f.data){const[y,m,d]=f.data.split('-').map(Number);v.value=new Date(Date.UTC(y,m-1,d));v.numFmt='dd/mm/yyyy'}
  else if(L.l==='HORÁRIO PROGRAMADO:'&&f.hora){const[h,mi]=f.hora.split(':').map(Number);v.value=(h*60+mi)/1440;v.numFmt='hh:mm'}
  else if(L.l.startsWith('VALOR')&&num(f.valor)!=null){v.value=num(f.valor);v.numFmt='#,##0.00'}
  else v.value=L.v||null;
  v.font=L.mdfe?{name:'Arial',size:10.5,color:{argb:'FF71717A'}}:{name:'Aptos',size:11,bold:!!L.b};
  const longo=String(L.v||'').length>52;
  v.alignment={horizontal:'center',vertical:'middle',wrapText:longo};
  ws.getRow(r).height=L.tall?40.9:longo?31.5:15.75;
  box(r);r++;
 }
 r+=2;ws.getCell(r,2).value='Enviar para: ';const fo=f.fone.replace(/\D/g,'');ws.getCell(r,3).value=fo?Number(fo):null;
 [2,3].forEach(c=>ws.getCell(r,c).font={name:'Aptos Narrow',size:11});ws.getCell(r,3).alignment={horizontal:'left'};
 ws.pageSetup={paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0};
 const buf=await wb.xlsx.writeBuffer();
 return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function montarImagem(){
 if(!window.html2canvas){msg='Não consegui carregar o gerador de imagem. Use Imprimir ou PDF.';render();return null}
 const c=await html2canvas(document.getElementById('paper'),{scale:2,backgroundColor:'#ffffff'});
 return await new Promise(res=>c.toBlob(res,'image/png'));
}

let hist={mes:'',lista:[],q:'',carregando:false,erro:'',unsub:null};
function mesAtual(){return hojeISO().slice(0,7)}
function ouvirHist(){
 if(hist.unsub){hist.unsub();hist.unsub=null}
 if(!db||!eu)return;
 hist.carregando=true;hist.erro='';
 hist.unsub=db.collection('monitoramento_hist').where('mes','==',hist.mes).onSnapshot(s=>{
  hist.lista=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>((b.dataSaida||'')+(b.horaSaida||'')).localeCompare((a.dataSaida||'')+(a.horaSaida||'')));
  hist.carregando=false;if(aba==='hist')render()},e=>{hist.carregando=false;hist.erro=erroFb(e);if(aba==='hist')render()});
}
function histFiltrada(){const q=semAcento(hist.q).toUpperCase();
 return hist.lista.filter(h=>!q||semAcento([h.motorista,h.placa,h.transportadora,h.mdfe,h.destinos,h.tipoVeiculo,h.geradoPor].join(' ')).toUpperCase().includes(q))}
function vHist(){
 if(!hist.mes){hist.mes=mesAtual();ouvirHist()}
 const L=histFiltrada();
 const porT={};L.forEach(h=>{const k=h.transportadora||'(sem transportadora)';porT[k]=porT[k]||{n:0,placas:new Set()};porT[k].n++;porT[k].placas.add(h.placa)});

 <div class="tools"><div><label for="hm">Mês da saída</label><input id="hm" type="month" value="${esc(hist.mes)}"></div>
 <div class="grow"><label for="hq">Filtrar</label><input id="hq" type="search" value="${esc(hist.q)}" placeholder="Motorista, placa, transportadora, MDF-e ou destino"></div>
 <button type="button" class="btn" id="hx" ${L.length?'':'disabled'}>Baixar Excel do histórico</button></div>
 ${hist.erro?`<p class="hint warn">Não consegui ler o histórico: ${esc(hist.erro)}.</p>`:''}
 ${hist.carregando?'<p class="hint">Carregando…</p>':''}
 ${Object.keys(porT).length?`<div class="tablewrap" style="margin-bottom:14px"><table class="list"><thead><tr><th>Transportadora</th><th>Viagens</th><th>Placas</th></tr></thead><tbody>
 ${Object.entries(porT).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${v.placas.size}</td></tr>`).join('')}</tbody></table></div>`:''}
 <div class="tablewrap"><table class="list"><thead><tr><th>Saída</th><th>Motorista</th><th>Placa</th><th>Tipo</th><th>Transportadora</th><th>Destinos</th><th>Valor do veículo</th><th>Chave MDF-e</th><th>Gerado por</th><th></th></tr></thead><tbody>
 ${L.map(h=>`<tr><td style="white-space:nowrap">${esc(dataBR(h.dataSaida))} ${esc(h.horaSaida)}</td><td>${esc(h.motorista)}</td><td><b>${esc(h.placa)}</b></td><td>${esc(h.tipoVeiculo)}</td><td>${esc(h.transportadora)}</td>
 <td>${esc(h.destinos)}</td><td style="white-space:nowrap">${h.valorVeiculo!=null?'R$ '+esc(moeda(h.valorVeiculo)):''}</td><td style="font-size:12px;word-break:break-all;min-width:150px">${h.mdfe?esc(h.mdfe):'<span class="hint warn">sem chave</span>'}</td>
 <td style="font-size:13px">${esc(h.geradoPor)}${(h.acoes||[]).length>1?`<br><span class="hint">${h.acoes.length} gerações</span>`:''}</td>
 <td class="act"><button class="btn sec small" data-re="${esc(h.id)}">Reabrir</button></td></tr>`).join('')}
 </tbody></table></div><p class="count">${L.length} solicitação(ões) em ${esc(hist.mes.split('-').reverse().join('/'))}</p></section>`;
}
function ligarHist(){
 document.getElementById('hm').addEventListener('change',e=>{hist.mes=e.target.value||mesAtual();hist.lista=[];ouvirHist();render()});
 const q=document.getElementById('hq');q.addEventListener('input',e=>{hist.q=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('hq');n.focus();n.setSelectionRange(p,p)});

  const idx={};for(const[k,re]of Object.entries(testes)){const j=h.findIndex(c=>re.test(c));if(j>=0)idx[k]=j}
  if(Object.keys(idx).length>=2)return {r,idx}}return null}
function importarJSON(j){

  if(m){if(x.tel&&!m.tel){m.tel=soTel(x.tel);at++}if(x.p&&!m.p)m.p=normPlaca(x.p);if(x.t&&!m.t)m.t=up(x.t)}
  else{st.mot.push({n,t:up(x.t),p:normPlaca(x.p),tel:soTel(x.tel)});am++}});
 (j.placas||[]).forEach(x=>{const p=normPlaca(x.p);if(!p)return;const o=st.pla.find(y=>y.p===p);
  if(o){if(x.tipo&&!o.tipo)o.tipo=up(x.tipo);if(x.t&&!o.t)o.t=up(x.t);if(x.v!=null&&o.v==null)o.v=num(x.v)}
  else{st.pla.push({p,tipo:up(x.tipo),t:up(x.t),v:num(x.v)});ap++}});
 ordenar();salvar('mot');salvar('pla');
 msg=`Histórico carregado: ${am} motorista(s), ${ap} placa(s) e ${at} celular(es) novos.`;render();

async function importar(file,k){
 if(!/\.json$/i.test(file.name)&&!window.XLSX){msg='Não consegui carregar o leitor de planilhas. Recarregue a página.';render();return}
 try{
  if(/\.json$/i.test(file.name))return importarJSON(JSON.parse(await file.text()));
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  if(k==='bas')return importarBases(wb,file.name);
  let addM=0,addP=0,addT=0;
  const placaOk=p=>/^[A-Z]{3}\d[A-Z0-9]\d{2}$/.test(p);
  for(const nome of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,defval:'',raw:false});
   const h=acharCabecalho(rows,{mot:/^motorista|nome do motorista/,pla:/^placa|matricula do veiculo|placa do veiculo/,tr:/transportador/,ve:/^veiculo$|tipo de veiculo|^tipo$/,tel:/^numero de celular|^celular|^telefone$|^telefone do motorista/,res:/^residencia/,sta:/^status do motorista|^status do veiculo|^status$/});
   if(!h)continue;
   const sistema=h.idx.tel!=null&&h.idx.res!=null;
   const veic=h.idx.mot==null&&h.idx.pla!=null;
   for(const row of rows.slice(h.r+1)){
    const g=k=>h.idx[k]!=null?String(row[h.idx[k]]??''):'';
    const n=up(g('mot')),p=normPlaca(g('pla').split(/[,;/]/)[0]),t=up(g('tr')),ve=up(g('ve')).replace(/\.$/,''),tel=soTel(g('tel'));
    if(veic){ // arquivo Informações do Veículo: uma linha por placa, sem motorista
     if(!placaOk(p))continue;
     const tipo=up(g('ve')).replace(/[（(].*$/,'').trim(),trv=/^ANJUN_\d/i.test(t)?'ANJUN (FROTA PRÓPRIA)':/_\d{6,}|^provider_/i.test(t)?'':t,ativo=!g('sta')||/^ativ/i.test(g('sta').trim());
     const o=st.pla.find(x=>x.p===p);
     if(o){let mud=false;if(tipo&&o.tipo!==tipo){o.tipo=tipo;mud=true}if(trv&&(!o.t||/^ANJUN$/.test(o.t))){o.t=trv;mud=true}if(mud)addT++}
     else if(ativo&&!/SUPORTE DE CARGA|VEICULO DE APOIO|VEÍCULO DE APOIO|THREE-WHEELER/.test(tipo)){st.pla.push({p,tipo,t:trv,v:null});addP++}
     continue;
    }
    if(!n||n.length<4)continue;
    if(g('sta')&&!/^ativ/i.test(g('sta').trim()))continue;
    const k=semAcento(n);
    let m=st.mot.find(x=>semAcento(x.n)===k)||st.mot.find(x=>k.startsWith(semAcento(x.n)+' '));
    if(m&&sistema&&g('res').trim()!=='MG-32'&&st.mot.filter(x=>x===m).length&&rows.some(rr=>rr!==row&&semAcento(up(rr[h.idx.mot]))===k&&String(rr[h.idx.res]).trim()==='MG-32'))continue;
    if(m){if(tel&&m.tel!==tel){m.tel=tel;addT++}if(!m.p&&placaOk(p))m.p=p;if(m.n!==n&&k.startsWith(semAcento(m.n)+' '))m.n=n}
    else{
     if(sistema&&g('res').trim()!=='MG-32')continue;
     if(tel&&st.mot.some(x=>x.tel===tel))continue;
     st.mot.push({n,t,p:placaOk(p)?p:'',tel});addM++;
    }
    if(placaOk(p)&&!st.pla.some(x=>x.p===p)){st.pla.push({p,tipo:ve,t,v:null});addP++}
   }}
  ordenar();salvar('mot');salvar('pla');
  msg=`Importação concluída: ${addM} motorista(s) novo(s), ${addP} placa(s) nova(s) e ${addT} cadastro(s) atualizado(s).`;
 }catch(err){msg='Não consegui ler o arquivo: '+(err.message||err)}
 render();
}
function importarBases(wb,nomeArq){
 const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
 const h=acharCabecalho(rows,{c:/^nome do site/,t:/tipo de ponto/,e:/endereco/,ci:/^cidade|municipio/,uf:/^estado$|^uf$/,s:/^status|situacao|estado do ponto/});
 if(!h||h.idx.c==null||h.idx.e==null){msg='Não achei as colunas "Nome do Site" e "Endereço". Confira se é a exportação da Gestão de Pontos.';render();return}
 const novo=[],vistos=new Set();
 for(const row of rows.slice(h.r+1)){
  const c=nc(row[h.idx.c]);if(!c||vistos.has(c))continue;
  const t=h.idx.t!=null?String(row[h.idx.t]).trim():'';if(/minidrop/i.test(t))continue;
  if(h.idx.s!=null){const s=semAcento(String(row[h.idx.s])).toLowerCase();if(s&&(/desativ|inativ/.test(s)||!/ativ/.test(s)))continue}
  vistos.add(c);novo.push({c,t,e:String(row[h.idx.e]).trim(),ci:h.idx.ci!=null?String(row[h.idx.ci]).trim():'',uf:h.idx.uf!=null?String(row[h.idx.uf]).trim().toUpperCase():c.slice(0,2)});
 }
 if(novo.length<50){msg='A planilha trouxe só '+novo.length+' bases ativas. Não substituí para não perder a base atual.';render();return}
 const antes=new Map(st.bas.map(b=>[b.c,b]));let ent=0,mud=0;novo.forEach(b=>{const a=antes.get(b.c);if(!a)ent++;else if(a.e!==b.e)mud++});
 const sai=st.bas.filter(b=>!novo.some(x=>x.c===b.c)).length;
 st.bas=novo.sort((a,b)=>a.c.localeCompare(b.c));st.basInfo=nomeArq+' · importada em '+new Date().toLocaleDateString('pt-BR');reindex();salvar('bas');
 msg=`Base atualizada: ${novo.length} bases ativas, ${ent} novas, ${sai} saíram, ${mud} endereços mudaram.`;render();
}

  btn.disabled=true;loginMsg='';
  try{const m=await db.collection('loginMap').doc(u).get();if(!m.exists)throw {code:'invalido'};
   await auth.signInWithEmailAndPassword(m.data().authEmail,p)}
  catch(err){const c=err&&err.code;loginMsg=c==='auth/too-many-requests'?'Muitas tentativas. Espere alguns minutos.':c==='auth/network-request-failed'?'Sem conexão.':'Usuário ou senha inválidos.';btn.disabled=false;render()}
 });
}
function parar(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
async function iniciar(){
 const L=lerLocal();
 st.bas=basesDeLista(BASES_INI);
 if(L.f)f={...f,...L.f};f.data=hojeISO();f.hora=horaAgora();
 reindex();
 if(!window.firebase){document.body.classList.add('out');document.getElementById('view').innerHTML='<section class="panel login"><h2>Sem conexão</h2><p>Não consegui carregar o Firebase. Confira a internet e recarregue a página.</p></section>';status('');return}
 firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();
 auth.onAuthStateChanged(async user=>{
  parar();eu=null;if(hist.unsub){hist.unsub();hist.unsub=null}hist.mes='';hist.lista=[];
  if(!user){document.body.classList.add('out');document.getElementById('who').hidden=true;st.mot=[];st.pla=[];reindex();status('');aba='form';render();return}
  try{const sn=await db.collection('users').doc(user.uid).get();
   if(!sn.exists||sn.data().ativo!==true){loginMsg='Seu acesso não está liberado ou foi desativado.';await auth.signOut();return}
   eu={uid:user.uid,...sn.data()};
  }catch(e){loginMsg='Não consegui conferir seu acesso: '+erroFb(e);await auth.signOut();return}
  document.body.classList.remove('out');
  const w=document.getElementById('who');w.hidden=false;w.innerHTML=esc(eu.nome||eu.usuario||'')+'<button class="linkbtn" id="sair" type="button">Sair</button>';
  document.getElementById('sair').addEventListener('click',()=>auth.signOut());
  status('Conectando…');render();
  const ref=db.collection(COL);
  unsubs.push(ref.doc('motoristas').onSnapshot(s=>{st.mot=s.exists?(s.data().lista||[]):[];ordenar();status('Salvo no Firebase');if(!editando)render()},e=>status('Erro ao ler motoristas: '+erroFb(e))));
  unsubs.push(ref.doc('placas').onSnapshot(s=>{st.pla=s.exists?(s.data().lista||[]):[];ordenar();if(!editando)render()},()=>{}));
  unsubs.push(ref.doc('bases').onSnapshot(s=>{if(s.exists&&(s.data().lista||[]).length>=50){st.bas=basesDeLista(s.data().lista).sort((a,b)=>a.c.localeCompare(b.c));st.basInfo=s.data().info||st.basInfo;reindex();if(!editando)render()}},()=>{}));
 });
}
let agendado=false,emRender=false;
function render(){if(emRender){agendado=true;return}emRender=true;try{_render()}finally{emRender=false}if(agendado){agendado=false;setTimeout(render,0)}}
function _render(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===aba)));
 const v=document.getElementById('view');
 if(!eu){v.innerHTML=vLogin();ligarLogin();return}
 if(aba==='form'){v.innerHTML=vForm();ligarForm()}
 else if(aba==='hist'){v.innerHTML=vHist();ligarHist()}
 else{v.innerHTML=aba==='mot'?vMot():aba==='pla'?vPla():vBas();ligarLista(aba)}
}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{aba=b.dataset.tab;msg='';editando=null;render();window.scrollTo(0,0)}));
iniciar();
</script>
